name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 取消同一分支上旧的、仍在运行的流水线，避免资源浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (with -race)
    runs-on: ubuntu-latest
    env:
      # 依赖仓库均为公开 GitHub 仓库，直接走 VCS 拉取，不经受任何模块代理。
      GOPROXY: direct
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 采用最新稳定版 Go，可满足 go.mod 中声明的语言版本要求。
          go-version: "stable"
          check-latest: true
          # 关闭内置模块缓存：GOPROXY=direct 会把依赖以 git 浅克隆形式落在
          # cache/vcs 里；actions 恢复一个半旧/复用的浅克隆后，go 的
          # `git fetch --unshallow` 会撞上 “shallow file has changed since we read it”
          # 这类 git 竞态并导致构建失败。用 direct 拉取本就无需这层缓存。
          cache: false

      - name: Warm module cache (direct VCS)
        # 兜底：清掉 runner 上可能残留的模块缓存，再以 direct 单线程预下载全部依赖，
        # 避免后续 go vet/build/test 并发拉取时踩到损坏的浅克隆；如偶发网络抖动可重跑。
        run: |
          go clean -modcache 2>/dev/null || true
          go mod download

      - name: gofmt
        # 任何未格式化文件都会使本次检查失败（提交门槛）。
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 检查："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race, CGO)
        # 数据竞争检测 (-race) 依赖 CGO，本机若缺少 C 编译器无法运行；
        # 在 GitHub 的 Linux runner 上开启 CGO_ENABLED=1 后即可进行竞争检测。
        run: CGO_ENABLED=1 go test -race -count=1 ./...
