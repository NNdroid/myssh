name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 取消同一分支上旧的、仍在运行的流水线，避免资源浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (with -race)
    runs-on: ubuntu-latest
    env:
      # 公共模块（含 gopkg.in/*，其源站反向代理间歇性 502）优先走官方模块代理，
      # 不再直连 gopkg.in；NNdroid/* 公共仓库代理同样可供给，若代理 404/410
      # 则自动落到 direct（git VCS 直连）兜底，行为与纯 direct 一致。
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 采用最新稳定版 Go，可满足 go.mod 中声明的语言版本要求。
          go-version: "stable"
          check-latest: true
          # 关闭内置模块缓存：direct 兜底路径会把依赖以 git 浅克隆形式落在
          # cache/vcs 里；actions 恢复一个半旧/复用的浅克隆后，go 的
          # `git fetch --unshallow` 会撞上 “shallow file has changed since we read it”
          # 这类 git 竞态并导致构建失败。
          cache: false

      - name: Warm module cache (with retry)
        # 走 direct 兜底路径的依赖，Go 会以浅克隆拉进 cache/vcs，再 `git fetch
        # --unshallow` 取全量对象；runner 上 git 的后台 gc/maintenance 会在 unshallow
        # 期间改写 .git/shallow，触发 “shallow file has changed since we read it”。
        # 先全局关闭自动 gc/maintenance 消除并发写，再对 go mod download 做重试兜底
        # （该错误为时序竞态，重试常即通过；重试间清掉损坏的 vcs 浅克隆）。
        run: |
          git config --global gc.auto 0
          git config --global gc.autoDetach false
          git config --global maintenance.auto false
          go clean -modcache 2>/dev/null || true
          ok=0
          for i in 1 2 3 4 5; do
            if go mod download; then ok=1; break; fi
            echo "go mod download failed (attempt $i/5); clearing vcs cache and retrying"
            rm -rf "$(go env GOMODCACHE)/cache/vcs"
            sleep 3
          done
          [ "$ok" = "1" ] || { echo "go mod download failed after retries"; exit 1; }
          go mod verify

      - name: gofmt
        # 任何未格式化文件都会使本次检查失败（提交门槛）。
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt 检查："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race, CGO)
        # 数据竞争检测 (-race) 依赖 CGO，本机若缺少 C 编译器无法运行；
        # 在 GitHub 的 Linux runner 上开启 CGO_ENABLED=1 后即可进行竞争检测。
        run: CGO_ENABLED=1 go test -race -count=1 ./...
